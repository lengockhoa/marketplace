name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG="$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)"
          if [[ -n "$PREV_TAG" ]]; then
            RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"
          else
            RANGE="$(git rev-list --max-parents=0 HEAD | tail -n 1)..${GITHUB_REF_NAME}"
          fi
          {
            echo "## Changes in ${GITHUB_REF_NAME}"
            echo
            git log --no-merges --pretty=format:"- %s (%h by %an)" "$RANGE"
            echo
            echo
            echo "## Install / update"
            echo '```bash'
            echo 'curl -sL https://raw.githubusercontent.com/lengockhoa/marketplace/main/install-plugin-system.sh | bash'
            echo '```'
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: false
          body_path: release-notes.md
          fail_on_unmatched_files: true
